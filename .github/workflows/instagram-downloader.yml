name: Instagram Reel Downloader

on:
  schedule:
    - cron: '0 12 * * *'  # Runs at 12:00 UTC every day
  workflow_dispatch:  # Allows manual triggering

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create base output directory
      run: |
        mkdir -p ${{ secrets.BASE_OUTPUT_DIR }}
    
    - name: Process s0mebody CSV
      run: |
        python downloader.py ./links/_.s0mebody.csv --output-dir ${{ secrets.BASE_OUTPUT_DIR }}
    
    - name: Process instant_philosophy CSV
      run: |
        python downloader.py ./links/_instant_philosophy.csv --output-dir ${{ secrets.BASE_OUTPUT_DIR }} 