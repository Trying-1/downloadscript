name: Instagram Reel Downloader

on:
  schedule:
    - cron: '0 12 * * *'  # Runs at 12:00 UTC every day
  workflow_dispatch:  # Allows manual triggering

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: |
        mkdir -p ${{ secrets.BASE_OUTPUT_DIR }}
    
    - name: Run Instagram Downloader
      env:
        BASE_OUTPUT_DIR: ${{ secrets.BASE_OUTPUT_DIR }}
      run: |
        # Create logs directory
        mkdir -p logs
        # Run the downloader with log file in logs directory
        python src/downloader.py --csv-dir ./links --output-dir ${{ secrets.BASE_OUTPUT_DIR }} --log-dir ./logs
    
    - name: Upload logs
      if: always()  # Upload logs even if the previous step fails
      uses: actions/upload-artifact@v3
      with:
        name: instagram-downloader-logs
        path: logs/instagram_downloader.log
        retention-days: 5 